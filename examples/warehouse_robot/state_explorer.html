<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Warehouse robot state explorer</title>
    <style>
      body {
        margin: 0;
        background: #f1f5f9;
        color: #172033;
        font: 16px system-ui;
      }

      header {
        padding: 2rem;
        background: #172554;
        color: white;
      }

      main {
        max-width: 850px;
        margin: auto;
        padding: 2rem;
      }

      .panel {
        padding: 1.5rem;
        border-radius: 0.8rem;
        background: white;
        box-shadow: 0 8px 30px #0f172a18;
      }

      .state {
        margin: 0.5rem 0 1.5rem;
        color: #1d4ed8;
        font-size: 2.2rem;
      }

      button {
        display: block;
        width: 100%;
        margin: 0.6rem 0;
        padding: 0.8rem;
        border: 1px solid #93c5fd;
        border-radius: 0.45rem;
        background: #eff6ff;
        cursor: pointer;
        text-align: left;
      }

      button:hover {
        background: #dbeafe;
      }

      .history {
        color: #475569;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Autonomous warehouse robot</h1>
      <p>Interactive state explorer generated from the mission state machine</p>
    </header>
    <main>
      <section class="panel">
        <small>CURRENT STATE</small>
        <div id="state" class="state"></div>
        <h2>Legal transitions</h2>
        <div id="choices"></div>
        <h2>Execution history</h2>
        <div id="history" class="history"></div>
        <button id="reset">Reset to booting</button>
      </section>
    </main>
    <script>
      const edges = [{{EDGES}}];
      let current = "booting";
      let history = [];
      const state = document.querySelector("#state");
      const choices = document.querySelector("#choices");
      const trail = document.querySelector("#history");

      function render() {
        state.textContent = current;
        trail.textContent = history.length
          ? history.join(" → ")
          : "No transitions executed";
        choices.replaceChildren();

        const next = edges.filter((edge) => edge.from === current);
        if (!next.length) {
          choices.textContent = "No outgoing transition is modelled.";
          return;
        }

        next.forEach((edge) => {
          const button = document.createElement("button");
          button.textContent = `Transition to ${edge.to}`;
          button.onclick = () => {
            history.push(current);
            current = edge.to;
            render();
          };
          choices.appendChild(button);
        });
      }

      document.querySelector("#reset").onclick = () => {
        current = "booting";
        history = [];
        render();
      };

      render();
    </script>
  </body>
</html>
