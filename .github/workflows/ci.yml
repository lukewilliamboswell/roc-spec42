name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  roc-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Roc nightly
        id: roc-version
        run: printf 'tag=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_OUTPUT"
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.tag }}
      - run: roc check examples/generate_summary.roc
      - run: roc docs platform/main.roc --output=/tmp/roc-spec42-docs --no-cache
