name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  roc-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Roc nightly
        id: roc-version
        run: printf 'tag=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_OUTPUT"
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.tag }}
      - name: Check and test every example script
        run: |
          while IFS= read -r source; do
            roc check "$source"
            roc test "$source"
          done < <(find examples -name '*.roc' -print | sort)
      - run: roc docs platform/main.roc --output=/tmp/roc-spec42-docs --no-cache

  packaged-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Spec42 revision
        run: |
          revision=$(sed -n '1p' .spec42-revision)
          git init ../spec42
          git -C ../spec42 remote add origin https://github.com/elan8/spec42.git
          git -C ../spec42 fetch --depth=1 origin "$revision"
          git -C ../spec42 checkout --detach FETCH_HEAD
      - name: Fetch Spec42 standard library bundle
        run: bash ../spec42/scripts/fetch-stdlib-bundle.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false
      - name: Read pinned Roc nightly
        id: roc-version
        run: printf 'tag=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_OUTPUT"
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.tag }}
      - name: Regenerate example snapshots
        run: scripts/update-example-snapshots.sh
      - name: Golden outputs are current
        run: git diff --exit-code -- examples
